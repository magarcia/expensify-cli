name: Bug report
description: Report a reproducible CLI problem.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow [SECURITY.md](https://github.com/magarcia/expensify-cli/blob/main/SECURITY.md).
        Share synthetic or redacted examples only. Never include tokens, device credentials, browser storage, credential files, receipts, or financial and personal data.
  - type: input
    id: version
    attributes:
      label: CLI version
      description: Output of `expensify --version`. For source builds, include the commit if known.
      placeholder: expensify v0.1.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: macOS 15 arm64, Ubuntu 24.04 amd64, or Windows 11 arm64
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Command and reproduction steps
      description: Include the command, flags, and smallest set of steps that triggers the problem. Replace account and resource identifiers with placeholders.
      placeholder: |
        1. Run `expensify ...`
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized error
      description: Include the error code and message. Share only the relevant redacted output, not configuration or API response dumps.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Other context
      description: Relevant installation method, browser name, or credential storage mode. Leave out secrets and account data.
